<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa Fortaleza | Desvios e Rotas</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0F5298',
                        secondary: '#FF9100',
                        bus: '#2563eb',
                        provisorio: '#F57C00',
                        permanente: '#D32F2F',
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="estilo.css">
</head>
<body class="bg-gray-50 font-sans">
    <header class="bg-primary text-white shadow-lg">
        <div class="container mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center">
            <div class="flex items-center mb-3 md:mb-0">
                <i class="fa fa-map-marker text-2xl mr-2"></i>
                <h1 class="text-xl font-bold">Mapa Fortaleza | Rotas e Desvios</h1>
            </div>
        </div>
    </header>

    <main class="container mx-auto px-4 py-6">
        <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">
            <div class="lg:col-span-3 bg-white rounded-xl shadow-md overflow-hidden">
                <div id="mapa" class="w-full h-[75vh]"></div>
            </div>

            <div class="space-y-5">
                <!-- 🚌 ROTAS -->
                <div class="bg-white rounded-xl shadow-md p-5">
                    <h2 class="text-lg font-bold text-bus mb-4"><i class="fa fa-bus mr-2"></i> Consultar Rota</h2>
                    <input type="text" id="linha-rota" placeholder="Número da linha" class="w-full p-2 border rounded mb-2">
                    <select id="sentido-rota" class="w-full p-2 border rounded mb-2">
                        <option value="ida">Ida</option>
                        <option value="volta">Volta</option>
                    </select>
                    <div class="flex gap-2">
                        <button id="btn-carregar-rota" class="flex-1 bg-bus text-white py-2 rounded">Carregar</button>
                        <button id="btn-atualizar-rota" class="flex-1 bg-gray-600 text-white py-2 rounded">Atualizar</button>
                    </div>
                    <div id="info-rota" class="hidden mt-3 p-2 bg-gray-50 rounded text-sm"></div>
                </div>

                <!-- 🔍 FILTROS COMPLETOS -->
                <div class="bg-white rounded-xl shadow-md p-5">
                    <h2 class="text-lg font-bold mb-4"><i class="fa fa-filter mr-2"></i> Filtrar Desvios</h2>
                    
                    <!-- Tipo -->
                    <div class="space-y-2 mb-4">
                        <label class="flex items-center gap-2 p-2 border rounded cursor-pointer bg-blue-50">
                            <input type="radio" name="filtro-tipo" value="todos" checked>
                            <span>📋 Mostrar Todos</span>
                        </label>
                        <label class="flex items-center gap-2 p-2 border rounded cursor-pointer">
                            <input type="radio" name="filtro-tipo" value="provisorio">
                            <span class="text-provisorio">🟡 Apenas Provisórios</span>
                        </label>
                        <label class="flex items-center gap-2 p-2 border rounded cursor-pointer">
                            <input type="radio" name="filtro-tipo" value="permanente">
                            <span class="text-permanente">🔴 Apenas Permanentes</span>
                        </label>
                    </div>

                    <!-- Motivo -->
                    <div class="mb-3">
                        <label class="text-xs text-gray-600 mb-1 block">Filtrar por Motivo</label>
                        <select id="filtro-motivo" class="w-full p-2 border rounded text-sm">
                            <option value="">Todos os motivos</option>
                        </select>
                    </div>

                    <!-- Linha -->
                    <div class="mb-3">
                        <label class="text-xs text-gray-600 mb-1 block">Filtrar por Linha</label>
                        <div class="flex gap-2">
                            <input type="text" id="filtro-linha" placeholder="Nº da linha" class="flex-1 p-2 border rounded text-sm">
                            <button id="btn-aplicar-filtro" class="px-3 bg-primary text-white rounded">Aplicar</button>
                        </div>
                    </div>

                    <button id="btn-limpar-filtro" class="w-full py-1 text-xs text-gray-600 underline">Limpar todos os filtros</button>
                </div>

                <!-- 🚨 CADASTRAR DESVIO -->
                <div class="bg-white rounded-xl shadow-md p-5">
                    <h2 class="text-lg font-bold mb-4"><i class="fa fa-exclamation-triangle mr-2"></i> Cadastrar Desvio</h2>
                    <p class="text-xs text-gray-600 mb-3">Clique no mapa para definir o local</p>

                    <div class="space-y-2 mb-4">
                        <label class="flex items-center gap-2 p-2 border rounded cursor-pointer">
                            <input type="radio" name="tipo-desvio" value="provisorio" checked>
                            <span class="font-medium text-provisorio">🟡 Desvio Provisório</span>
                        </label>
                        <label class="flex items-center gap-2 p-2 border rounded cursor-pointer">
                            <input type="radio" name="tipo-desvio" value="permanente">
                            <span class="font-medium text-permanente">🔴 Desvio Permanente</span>
                        </label>
                    </div>

                    <div class="grid grid-cols-2 gap-2 mb-2">
                        <input type="text" id="lat-desvio" placeholder="Latitude" class="p-2 border rounded text-sm">
                        <input type="text" id="lng-desvio" placeholder="Longitude" class="p-2 border rounded text-sm">
                    </div>

                    <input type="text" id="linhas-afetadas" placeholder="Linhas afetadas (ex: 011, 012)" class="w-full p-2 border rounded mb-2">
                    <textarea id="motivo-desvio" placeholder="Motivo do desvio" class="w-full p-2 border rounded mb-2 h-16"></textarea>
                    
                    <div class="grid grid-cols-2 gap-2 mb-3">
                        <div>
                            <label class="text-xs text-gray-600">Início</label>
                            <input type="time" id="horario-inicio" class="w-full p-2 border rounded">
                        </div>
                        <div>
                            <label class="text-xs text-gray-600">Fim</label>
                            <input type="time" id="horario-final" class="w-full p-2 border rounded">
                        </div>
                    </div>

                    <button id="btn-salvar-desvio" class="w-full bg-primary text-white py-2 rounded">✅ Salvar Desvio</button>
                </div>

                <!-- 📋 LISTA -->
                <div class="bg-white rounded-xl shadow-md p-5">
                    <h3 class="font-bold mb-3">📋 Desvios Exibidos</h3>
                    <div id="lista-desvios" class="text-xs space-y-2 max-h-48 overflow-y-auto">
                        <p class="text-gray-500">Carregando...</p>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
