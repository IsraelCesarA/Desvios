<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa Fortaleza | Colaborativo</title>
    
    <!-- Bibliotecas -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0F5298',
                        secondary: '#FF9100',
                        danger: '#E53935',
                        success: '#43A047',
                        warning: '#FDD835',
                        bus: '#2563eb',
                        parada: '#C2185B',
                        colabora: '#7B1FA2',
                        problemaFixo: '#ffcc00',
                        problemaDia: '#F57C00',
                    }
                }
            }
        }
    </script>

    <link rel="stylesheet" href="estilo.css">
</head>
<body class="bg-gray-50 font-sans">
    <header class="bg-primary text-white shadow-lg">
        <div class="container mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center">
            <div class="flex items-center mb-3 md:mb-0">
                <i class="fa fa-map-marker text-2xl mr-2"></i>
                <h1 class="text-xl font-bold">Mapa Fortaleza | Colaborativo</h1>
            </div>
            <div class="w-full md:w-1/3 relative flex gap-2">
                <input type="text" id="busca-endereco" placeholder="Rua, Nº, Bairro..." class="flex-1 px-4 py-2 rounded-lg text-gray-800">
                <button id="btn-busca" class="px-3 py-2 bg-secondary text-white rounded-lg"><i class="fa fa-search"></i></button>
                <button id="btn-minha-localizacao" class="px-3 py-2 bg-blue-600 text-white rounded-lg">📍</button>
            </div>
        </div>
    </header>

    <div class="bg-white shadow-md border-b">
        <div class="container mx-auto px-4">
            <div class="flex gap-4">
                <button class="aba-ativa py-3 px-4 font-medium text-primary border-b-2 border-primary" data-alvo="mapa">🗺️ Mapa</button>
                <button class="py-3 px-4 font-medium text-gray-600" data-alvo="onibus">🚌 Rotas</button>
                <button class="py-3 px-4 font-medium text-gray-600" data-alvo="paradas">🚏 Paradas</button>
                <button class="py-3 px-4 font-medium text-gray-600" data-alvo="colabora">🚨 Relatos</button>
            </div>
        </div>
    </div>

    <main class="container mx-auto px-4 py-6">
        <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">
            <div class="lg:col-span-3 bg-white rounded-xl shadow-md overflow-hidden">
                <div id="mapa" class="w-full h-[70vh]"></div>
            </div>

            <div class="space-y-5">
                <!-- 🚌 CONSULTA DE ROTAS (FUNCIONANDO) -->
                <div class="bg-white rounded-xl shadow-md p-5">
                    <h2 class="text-lg font-bold text-bus mb-4"><i class="fa fa-bus mr-2"></i> Consultar Rota</h2>
                    <div class="space-y-3">
                        <div>
                            <label class="text-xs font-medium text-gray-700">Número da Linha</label>
                            <input type="text" id="linha-rota" placeholder="Ex: 011, 012..." class="w-full p-2 border rounded-lg text-sm">
                        </div>
                        <div>
                            <label class="text-xs font-medium text-gray-700">Sentido</label>
                            <select id="sentido-rota" class="w-full p-2 border rounded-lg text-sm">
                                <option value="ida">Ida</option>
                                <option value="volta">Volta</option>
                            </select>
                        </div>
                        <div class="flex gap-2">
                            <button id="btn-carregar-rota" class="flex-1 bg-bus text-white py-2 rounded-lg text-sm">🚀 Carregar</button>
                            <button id="btn-atualizar-rota" class="flex-1 bg-gray-600 text-white py-2 rounded-lg text-sm">🔄 Atualizar</button>
                        </div>
                        <div id="info-rota" class="hidden p-3 bg-gray-50 rounded-lg text-sm"></div>
                    </div>
                </div>

                <!-- 🚏 CADASTRAR PARADA -->
                <div class="bg-white rounded-xl shadow-md p-5">
                    <h2 class="text-lg font-bold text-parada mb-4"><i class="fa fa-map-pin mr-2"></i> Cadastrar Parada</h2>
                    <input type="text" id="nome-parada" placeholder="Nome da parada" class="w-full p-2 border rounded-lg text-sm mb-2">
                    <div class="grid grid-cols-2 gap-2 mb-2">
                        <input type="text" id="lat-parada" placeholder="Lat" class="w-full p-2 border rounded-lg text-sm">
                        <input type="text" id="lng-parada" placeholder="Lng" class="w-full p-2 border rounded-lg text-sm">
                    </div>
                    <button id="btn-salvar-parada" class="w-full bg-parada text-white py-2 rounded-lg text-sm">🚏 Salvar</button>
                </div>

                <!-- 🚨 RELATOS (COMPLETO COM FIXO E TEMPORÁRIO) -->
                <div id="painel-colabora" class="bg-white rounded-xl shadow-md p-5">
                    <h2 class="text-lg font-bold text-colabora flex items-center mb-4">
                        <i class="fa fa-exclamation-triangle mr-2"></i> Relatar Problema
                    </h2>
                    <p class="text-sm text-gray-600 mb-3">Clique no mapa primeiro para definir o local:</p>

                    <div class="space-y-3 mb-4">
                        <label class="flex items-center gap-2 p-2 border rounded-lg hover:bg-gray-50 cursor-pointer">
                            <input type="radio" name="tipo-problema" value="fixo" checked>
                            <div>
                                <div class="font-medium">🚧 Problema Fixo / Obra</div>
                                <div class="text-xs text-gray-500">Fica salvo até ser removido manualmente</div>
                            </div>
                        </label>
                        <label class="flex items-center gap-2 p-2 border rounded-lg hover:bg-gray-50 cursor-pointer">
                            <input type="radio" name="tipo-problema" value="diario">
                            <div>
                                <div class="font-medium">💥 Ocorrência do Dia</div>
                                <div class="text-xs text-gray-500">Acidente, bloqueio — apaga automaticamente à meia-noite</div>
                            </div>
                        </label>
                    </div>

                    <textarea id="descricao-problema" placeholder="Descreva o problema..." class="w-full p-2 border rounded-lg text-sm h-20"></textarea>

                    <button id="btn-adicionar-problema" class="w-full mt-3 bg-colabora text-white py-2 rounded-lg hover:bg-opacity-90">
                        📍 Salvar Relato
                    </button>

                    <div class="mt-4 pt-3 border-t border-gray-200">
                        <h3 class="font-semibold text-sm mb-2">📋 Relatos Ativos</h3>
                        <div id="lista-relatos" class="text-sm space-y-1 max-h-32 overflow-y-auto">
                            <p class="text-gray-500 text-xs">Carregando...</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
